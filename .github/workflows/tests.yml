name: Tests

on:
  push:
    branches: [master]
  pull_request:

# Workflow-wide minimal token: a read-only contents token cannot rewrite
# the repo, comment on PRs, or interact with packages even if it leaks.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.0', '12.0', '13.0']
        include:
          # Map Laravel version → Testbench version
          - { laravel: '11.0', testbench: '9.0' }
          - { laravel: '12.0', testbench: '10.0' }
          - { laravel: '13.0', testbench: '11.0' }

    name: "PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      # setup-php's internal handoff of GITHUB_TOKEN to Composer's auth.json
      # has been seen to write the runner-masked `***` literal instead of the
      # real value. Write auth.json ourselves so Composer always sees the token.
      - name: Configure Composer authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GH_TOKEN"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.composer/cache/files
          key: composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Pin matrix versions
        run: |
          composer remove --dev --no-update larastan/larastan rector/rector driftingly/rector-laravel laravel/pint
          composer require --dev --no-update \
            "laravel/framework:^${{ matrix.laravel }}" \
            "orchestra/testbench:^${{ matrix.testbench }}"

      # Laravel 11's security-support window closed (~March 2026), so
      # advisories against the 11.x line are never patched and Composer's
      # resolver refuses to install every affected version — the cell can't
      # install at all without ignoring them. Enumerating advisory IDs is
      # brittle: every newly published advisory against the EOL line breaks
      # this cell again (that is exactly how it broke). Ignore the whole
      # laravel/framework package instead, so the cell stays green as the
      # advisory list grows. All are app-level vulns unrelated to the
      # journey-runner code under test. 12.x and 13.x stay strict.
      - name: Allow EOL Laravel 11 (ignore unpatched advisories)
        if: matrix.laravel == '11.0'
        run: >-
          composer config --json policy.advisories.ignore '["laravel/framework"]'

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis & code style

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2

      # See "Configure Composer authentication" note in the test job.
      - name: Configure Composer authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global --auth github-oauth.github.com "$GH_TOKEN"

      - name: Cache Composer dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.composer/cache/files
          key: composer-static-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-static-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Larastan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Run Pint (test mode)
        run: vendor/bin/pint --test

  actionlint:
    runs-on: ubuntu-latest
    name: Lint workflows

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
